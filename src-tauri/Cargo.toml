[package]
name = "secret-vault"
version = "0.1.0"
edition = "2024"

[lib]
name = "secret_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "secret-vault"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri"]

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
rand = "0.8.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tauri = { version = "2.5.1", optional = true }
thiserror = "2.0.12"
zeroize = { version = "1.8.1", features = ["derive"] }

[build-dependencies]
tauri-build = "2.2.0"

[dev-dependencies]
tempfile = "3.19.1"
